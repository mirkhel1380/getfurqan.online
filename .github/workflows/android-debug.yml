name: Al Furqan Android trial
on:
  push:
    branches: [main]
    paths: ['mobile/android/**', 'mobile/src/**', 'mobile/scripts/**', 'mobile/package*.json', '.github/workflows/android-debug.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - run: python3 scripts/check-android-signature.py
      - run: npx cap sync android
      - name: Download verified Gradle distribution
        run: bash ../scripts/bootstrap-android-gradle.sh
        working-directory: mobile/android
      - name: Build trial APK
        run: bash ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest assembleDebug assembleRelease
        working-directory: mobile/android
      - name: Verify the compiled and signed APK
        shell: bash
        run: |
          set -euo pipefail
          output='android/app/build/outputs/apk/debug'
          cp "$output/app-debug.apk" "$output/Al-Furqan-Android-0.1.5.apk"
          sdk_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          python3 scripts/verify-android-apk.py "$output/Al-Furqan-Android-0.1.5.apk" \
            --aapt "$sdk_tools/aapt" --apksigner "$sdk_tools/apksigner" > "$output/apk-verification.json"
          (cd "$output" && sha256sum Al-Furqan-Android-0.1.5.apk > SHA256SUMS.txt)
          cat "$output/apk-verification.json"
          python3 scripts/check-unsigned-android.py android/app/build/outputs/apk/release/app-release-unsigned.apk \
            --aapt "$sdk_tools/aapt" --apksigner "$sdk_tools/apksigner"
          "$sdk_tools/zipalign" -c -P 16 4 android/app/build/outputs/apk/release/app-release-unsigned.apk
          python3 scripts/check-signing-setup.py --apk "$output/Al-Furqan-Android-0.1.5.apk" --apksigner "$sdk_tools/apksigner"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Al-Furqan-Android-trial
          path: |
            mobile/android/app/build/outputs/apk/debug/Al-Furqan-Android-0.1.5.apk
            mobile/android/app/build/outputs/apk/debug/SHA256SUMS.txt
            mobile/android/app/build/outputs/apk/debug/apk-verification.json
          if-no-files-found: error
          retention-days: 14
