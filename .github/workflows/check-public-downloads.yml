name: Check public QR destination
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-public-downloads.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify the public iPhone guide and web app manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            https://getfurqan.online/ > "$RUNNER_TEMP/furqan-home.html"
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            https://getfurqan.online/app-manifest.json > "$RUNNER_TEMP/furqan-manifest.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP'])
          html = (folder / 'furqan-home.html').read_text()
          assert 'id="app-downloads"' in html, 'Public page is missing the download section'
          assert 'id="install-iphone"' in html, 'Public page is missing the iPhone guide'
          manifest = json.loads((folder / 'furqan-manifest.json').read_text())
          assert manifest['name'] == 'Al Furqan' and manifest['display'] == 'standalone'
          print('Public website, iPhone guide and standalone web app manifest verified without authentication.')
          PY
