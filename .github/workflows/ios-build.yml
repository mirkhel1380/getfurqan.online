name: Al Furqan iOS build
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - run: python3 scripts/check-ios-configuration.py
      - run: npx cap sync ios
      - name: Compile simulator and iPhone archive
        run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Al-Furqan-iOS-build
          path: |
            mobile/artifacts/ios/Al-Furqan-iOS-simulator.zip
            mobile/artifacts/ios/Al-Furqan-iOS-unsigned-archive.zip
            mobile/artifacts/ios/simulator-verification.json
            mobile/artifacts/ios/device-verification.json
            mobile/artifacts/ios/ios-build.json
            mobile/artifacts/ios/READ-ME-FIRST.md
            mobile/artifacts/ios/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Retain failed build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Al-Furqan-iOS-build-logs
          path: mobile/artifacts/ios/*.log
          if-no-files-found: ignore
          retention-days: 7
