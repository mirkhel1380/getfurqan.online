name: Prepare Android offline publisher archive
on:
  push:
    branches: [android-offline-preparation]
    paths: ['mobile/scripts/collect-quranenc.py', '.github/workflows/prepare-android-offline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Collect original publisher responses and audit every reference
        run: python3 mobile/scripts/collect-quranenc.py
      - name: Retain verified source cache for the Android build
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: mobile/.cache/installed-quranenc
          key: quranenc-v1-${{ hashFiles('mobile/installed-quranenc-lock.json') }}
      - name: Retain source manifest and audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Android-offline-source-audit
          path: mobile/artifacts/quranenc-audit/
          if-no-files-found: error
          retention-days: 14
